name: Publish Moonlit Lab

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/moonlit-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: moonlit-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Child-of-the-Unbound-Lord/Song-of-Righteousness-in-Mathematics-and-Physics'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Moonlit Lab static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
